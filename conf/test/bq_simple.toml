[data]
file = "data/banana_quality.csv"
inputStart = 0
inputSize = 7
outputStart = 7
outputSize = 1
seed = 42
testShare = 0.2

[network]
seed = 42
weightInitializer = "GLOROT_UNIFORM"

[[network.layer]]
neurons = 5
activationFunction = "SWISH"

[[network.layer]]
neurons = 1
activationFunction = "SIGMOID"

[trainer]
lossFunction = "CROSS_ENTROPY_LOSS"
maxEpochs = 6
shuffleEpoch = true
batchSize = 1
learningRate = 0.04
#exportFile = "models/test.knn"

[trainer.earlyStopping]
minDelta = 0.9
patience = 3

[scorer]
lossFunction = "CROSS_ENTROPY_LOSS"
type = "ClassificationScorer"

[visualization]
enabled = true

[visualization.heatmap]
interval = 2
[visualization.sankey]
interval = 2